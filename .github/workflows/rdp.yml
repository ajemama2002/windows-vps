name: Free Windows RDP
on: workflow_dispatch
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin Bobby123!
      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale-setup.exe
          Start-Process .\tailscale-setup.exe -ArgumentList "/quiet" -Wait
          Start-Sleep 15
      - name: Connect Tailscale
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=win-${{ github.run_id }}
          & $ts ip -4
          & $ts status
      - name: Keep Alive
        run: |
          Write-Host "USER: runneradmin PASS: Bobby123!"
          while ($true) { Write-Host "Running... $(Get-Date)"; Start-Sleep 60 }
