name: Free Windows RDP Forever 1min Restart
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0
          net user runneradmin Bobby123! /add 2>$null; net user runneradmin Bobby123!
          net localgroup "Administrators" runneradmin /add
          net localgroup "Remote Desktop Users" runneradmin /add
          Write-Host "RDP Enabled - runneradmin / Bobby123!"

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale-setup.exe
          Start-Process .\tailscale-setup.exe -ArgumentList "/quiet" -Wait
          Start-Sleep 15

      - name: Connect Tailscale
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=win-1min-${{ github.run_id }}
          & $ts ip -4
          echo "=== COPY THIS IP ==="

      - name: Keep Alive 5h 30m
        run: |
          $end = (Get-Date).AddMinutes(325)
          while ((Get-Date) -lt $end) {
            Write-Host "Running... restart at $end - $(Get-Date)"
            Start-Sleep 60
          }

      - name: Restart in 1 Minute
        if: always()
        run: |
          Write-Host "Restarting in 60 seconds..."
          Start-Sleep 60
          curl -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp.yml/dispatches -d '{"ref":"main"}'
