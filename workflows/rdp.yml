name: Windows RDP Working
on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          net user runneradmin Bobby123! /add /Y 2>&1 | Out-Null
          net user runneradmin Bobby123!
          net localgroup Administrators runneradmin /add 2>&1 | Out-Null
          Write-Host "RDP Ready - runneradmin / Bobby123!"

      - name: Install Tailscale
        run: |
          choco install tailscale -y --no-progress
          Start-Sleep 10

      - name: Connect to Tailscale
        run: |
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=win-vps-bobby
          Start-Sleep 5
          tailscale ip -4
          Write-Host "==== COPY THIS IP - THIS IS YOUR WINDOWS IP ===="
          tailscale ip -4

      - name: Keep Alive
        run: |
          Write-Host "VPS IS RUNNING - Connect with runneradmin / Bobby123!"
          while ($true) {
            Write-Host "Running at $(Get-Date)"
            Start-Sleep 60
          }
